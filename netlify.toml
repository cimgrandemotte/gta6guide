[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 404 réelle (le fichier existe) — pas de rewrite SPA, les 404 restent visibles.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Pas de redirect SPA : les 404 doivent rester visibles pour la QA S6.
