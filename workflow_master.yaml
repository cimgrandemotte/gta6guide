# ─────────────────────────────────────────────────────────────────────────────
# 0. CONSTITUTION — règles absolues, non négociables
# ─────────────────────────────────────────────────────────────────────────────
constitution:
  no_zip: true
  no_pdf: true
  images_format: jpg
  audio_format: mp3
  max_images_per_response: 10
  max_audio_per_response: 10
  web_research_at_every_state: true
  autonomy: "Totale à l'intérieur d'un état."
  continue_gate: "Demandé UNIQUEMENT aux transitions S0→S1→…→S7."
  no_pause_inside_state: true
  legal: "Site non officiel — Fan Guide. GTA VI © Rockstar Games / Take-Two Interactive."
  image_honesty: >-
    Les visuels sont des illustrations originales générées par IA, inspirées de
    l'esthétique néon Vice City. Elles ne sont PAS des screenshots officiels
    Rockstar et ne doivent jamais être présentées comme tels.
  user_reinforcement_2026_11_18: >-
    Rappel utilisateur à l'entrée de S1 : TOUTES les images générées doivent être
    des JPG HAUTE QUALITÉ, photoréalistes, cinématographiques et immersives.
    INTERDICTION ABSOLUE de produire des SVG ou des PNG en tant qu'images générées
    (les SVG inline restent autorisés uniquement comme éléments d'interface/UI,
    jamais comme fichiers image livrés). ≤ 10 images par réponse, ≤ 10 audios
    par réponse. Ces contraintes s'appliquent à S2, S3, S4, S5 et S6.
  fact_integrity: >-
    RÈGLE SUPÉRIEURE À TOUTE AUTRE : aucune information d'après-lancement
    (missions exactes, fins, codes de triche, trophées, collectibles, easter eggs
    découverts, scores définitifs, modes Online) ne peut être inventée ou publiée
    comme « vérifiée ». Chaque donnée porte un statut (voir fact_policy).
    Les sections non disponibles sont livrées avec un état « À compléter après le
    19/11/2026 » et une structure de données prête à recevoir les infos.

# ─────────────────────────────────────────────────────────────────────────────
# 1. POLITIQUE DE VÉRACITÉ — cadrage issu de la recherche S0
# ─────────────────────────────────────────────────────────────────────────────
fact_policy:
  statuses:
    official: "Confirmé par Rockstar / Take-Two / PlayStation / Xbox (source primaire)."
    press_confirmed: "Repris par plusieurs médias spécialisés crédibles, source primaire citée."
    community: "Cartographie / base de données communautaire (à recouper)."
    leak_unverified: "Fuite ou rumeur — à n'afficher qu'avec badge explicite, jamais comme fait."
    post_launch_pending: "N'existe pas encore légalement ; page structurée, contenu en attente."
    speculative: "Estimation / projection éditoriale, explicitement étiquetée."
  ui_rule: "Chaque fiche, tableau et carte affiche un badge de statut visible."
  json_rule: "research_data.json attache {value, status, source_url, retrieved_at} à CHAQUE fait."
  s2_press_rule: "Copies de review du 18/11/2026 = press_confirmed ; Rockstar seul = official. SpoilerToggle + badge obligatoires."
  known_unavailable_at_s0:
    - "Liste exhaustive et officielle des missions (noms, synopsis, stratégies)"
    - "Fins alternatives"
    - "Codes de triche officiels (publiés à la sortie)"
    - "Liste complète des trophées / succès"
    - "Collectibles et leurs localisations"
    - "Easter eggs découverts par la communauté"
    - "GTA VI Online : modes, missions, économie (non annoncé)"
    - "Scores Metacritic définitifs (embargo levé le 18/11/2026 seulement)"
  s0_verified_snapshot:
    - fact: "Sortie officielle : jeudi 19 novembre 2026, déblocage à minuit heure locale."
      status: official
      source: "Rockstar Newswire (6 nov. 2025) + Support Rockstar, via Wikipedia et gta6hype.com"
    - fact: "Plateformes natives : PS5, PS5 Pro, Xbox Series X|S. Aucun PC annoncé (Q1 2027 = rumeur de presse)."
      status: official
      source: "Wikipedia GTA VI, gamenewsplus.net"
    - fact: "Xbox One peut y jouer via Xbox Cloud Gaming (annonce Xbox du 10/11/2026)."
      status: press_confirmed
      source: "Wikipedia GTA VI (§ Release)"
    - fact: "Prix US : Standard 79,99 $ / Ultimate 99,99 $ (digital uniquement pour Ultimate)."
      status: official
      source: "Rockstar Store ; gtaboss.gg ; thepcenthusiast.com (25/06/2026)"
    - fact: "Bonus précommande : Vintage Vice City Pack + 1 mois de GTA+ (digital)."
      status: official
      source: "gtaboss.gg ; neoteo.com (12/11/2026)"
    - fact: "Préchargement depuis le 10/11/2026, jusqu'à 212 Go selon la machine."
      status: official
      source: "Rockstar Customer Support / Newswire"
    - fact: "Protagonistes jouables : Jason Duval & Lucia Caminos. Lucia = 1ère femme lead principal d'un GTA mainline."
      status: official
      source: "Rockstar GTA VI official site ; gtaboss.gg"
    - fact: "6 régions : Vice City, Leonida Keys, Grassrivers, Port Gellhorn, Ambrosia, Mount Kalaga National Park."
      status: official
      source: "Rockstar ; upcomer.com ; vice-city.app"
    - fact: "8 profils officiels / 9 personnes nommées : Jason, Lucia, Cal Hampton, Boobie Ike, Dre'Quan Priest, Real Dimez (Bae-Luxe & Roxy), Raul Bautista, Brian Heder."
      status: official
      source: "gtaboss.gg ; gta.fandom.com"
    - fact: "Compositeur du score : Justice. Moteur : RAGE. Producteur : Rob Nelson."
      status: press_confirmed
      source: "Wikipedia GTA VI (infobox)"
    - fact: "Embargo critiques levé le 18/11/2026 ; Metascore 99 (100 reviews PS5) = INSTANTANÉ, susceptible d'évoluer."
      status: press_confirmed
      source: "Dexerto, KeenGamer, playstationinfo.de (18/11/2026) — à re-vérifier en S1/S6"
    - fact: "Rockstar décrit GTA VI comme une expérience SOLO ; aucun GTA VI Online daté ni détaillé."
      status: official
      source: "Rockstar Newswire 'Pre-Order GTA VI' ; Yahoo/Tech (16/11/2026)"
  prompt_corrections:
    - claim: "Pas de version Xbox One"
      correction: "Vrai en natif, faux via Xbox Cloud Gaming (annonce du 10/11/2026). À préciser sur P16."
    - claim: "GTA VI Online — modes, missions, économie"
      correction: "Non annoncé officiellement. P14 doit être un hub 'statut officiel + spéculations étiquetées'."
    - claim: "Liste de ~22 PNJ (Dr Ansel Moreau, Viktor Sokolov, Shérif Clyde Bodine…)"
      correction: "Seuls 8 profils officiels confirmés ; le reste = leaks/communauté/noms non vérifiés. À trier en S1."
    - claim: "Carte 2× GTA V, 3× RDR2, 5 comtés, 62 espèces d'oiseaux, citation Rob Nelson juillet 2026"
      correction: "Estimations communautaires non sourcées primairement. À vérifier en S1, sinon badge 'estimation'."
    - claim: "Métadonnées type 'toutes les missions / tous les cheats / tous les trophées'"
      correction: "Indisponibles à J-1. Voir known_unavailable_at_s0."
    - claim: "Ambiances musicales synthwave, thèmes de personnages, moteur V8 en MP3"
      correction: "Les outils disponibles synthétisent des MP3 par génération de signaux (NumPy + lameenc), PAS de musique produite ni d'enregistrements réels. Les pistes seront des nappes/effets sonores originaux, étiquetés comme tels. La voix off (generate_speech) reste possible en MP3."
    - claim: "10 images JPG 'style officiel Rockstar'"
      correction: "Illustrations originales IA, jamais présentées comme captures officielles. Voir constitution.image_honesty."

