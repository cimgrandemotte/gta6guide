# ─────────────────────────────────────────────────────────────────────────────
# 7. RISQUES & MITIGATIONS
# ─────────────────────────────────────────────────────────────────────────────
risks:
  - { id: R1, risk: "Build à J-1 : données post-launch inexistantes", mitigation: "fact_policy + états post_launch_pending + structure prête à MAJ" }
  - { id: R2, risk: "Sites SEO/spam se faisant passer pour des sources officielles", mitigation: "Tiering des sources, privilégier Rockstar/Support/Store + presse recoupée" }
  - { id: R3, risk: "Metascore 99 = instantané du 18/11, évolutif", mitigation: "Horodater, libeller 'à la date du…', re-vérifier en S1/S6" }
  - { id: R4, risk: "Confusion illustration IA / screenshot officiel", mitigation: "constitution.image_honesty + crédits sur chaque page" }
  - { id: R5, risk: "Pas de synthèse musicale réelle ni d'audio sous licence", mitigation: "Signaux originaux NumPy+lameenc, étiquetés 'ambiance synthétique'" }
  - { id: R6, risk: "Aperçu in-app sandbox : CDN / polices / Leaflet externes bloqués", mitigation: "CSS inline critique, fallbacks systèmes, SVG inline, dégradation gracieuse" }
  - { id: R7, risk: "Dépendances pip non persistées dans le snapshot", mitigation: "tools/make_audio.py documente pip install numpy lameenc ; seuls les MP3 générés sont livrés" }
  - { id: R8, risk: "Volume ~60 pages + ~100 images > temps de réponse", mitigation: "Lots de 3 pages / 10 assets, reprise via state.json" }

