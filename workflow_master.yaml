# 2. MACHINE À ÉTATS
# ─────────────────────────────────────────────────────────────────────────────
state_machine:

  S0:
    name: INIT
    objective: "Lire le prompt, écrire le workflow, initialiser l'arborescence, le package.json et l'index racine."
    inputs: [MegaPrompt v3.0, "recherche web de cadrage"]
    deliverables:
      - workflow_master.yaml
      - state.json
      - package.json
      - index.html            # placeholder S0, remplacé en S3
      - README.md             # version S0, enrichie en S7
      - tools/serve.js        # serveur statique 0 dépendance, bind 0.0.0.0
      - tools/make_audio.py   # synthèse MP3 (NumPy + lameenc)
      - vercel.json / netlify.toml / .github/workflows/deploy.yml
      - "arborescence complète (36 dossiers) + .gitkeep"
    checkpoint:
      - "workflow_master.yaml présent et valide YAML"
      - "Tous les dossiers de FileStructure existent"
      - "Aucun ZIP / PDF / PNG / WebP / WAV produit"
      - "package.json + index racine servent sans dépendance externe"
    exit_gate: 'Demander "CONTINUER" → S1'
    next: S1

  S1:
    name: RESEARCH
    objective: "Collecte exhaustive et sourcée ; compilation de research_data.json."
    inputs: [sources_tiers_1_4, "recherche temps réel obligatoire"]
    deliverables:
      - research_data.json        # {value, status, source_url, retrieved_at} par fait
      - research_sources.md       # inventaire des sources + fiabilité
      - "tableau officiel / community / leak / post_launch_pending"
    checkpoint:
      - "Chaque fait possède statut + source + date"
      - "Contradictions du prompt arbitrées (prompt_corrections)"
      - "Aucune donnée d'après-lancement fabriquée"
      - "Périmètre presse/critiques (Metascore) daté du 18/11/2026"
    exit_gate: 'Résumé des points clés + demander "CONTINUER" → S2'
    next: S2

  S2:
    name: DESIGN_SYSTEM
    objective: "Tokens, composants, animations + 1er lot d'assets."
    inputs: [design_system_spec, research_data.json]
    deliverables:
      - assets/css/design_system.css
      - assets/css/animations.css
      - assets/css/components.css
      - assets/css/responsive.css
      - assets/js/components.js
      - assets/js/animations.js
      - "assets/images/** : 10 JPG (lot IMG001–IMG010)"
      - "assets/audio/** : 10 MP3 (lot AUD001–AUD010)"
    checkpoint:
      - "Palette #FF2D78 / #00D4FF / #FFD700 / #0A0A0F appliquée"
      - "Contraste texte ≥ 4.5:1 (WCAG AA)"
      - "10 JPG max, 10 MP3 max, aucun autre format — AUCUN SVG ni PNG comme image livrée"
      - "Les 10 JPG sont haute qualité, photoréalistes, cinématographiques, immersifs"
      - "Polices de repli système sans réseau pour l'aperçu in-app"
      - "research_data.json : source_url sur 100 % des faits + 93 missions structurées"
      - "QA assets : 10 JPG 1920x1080 / 1280x1920 q95 + 10 MP3, 0 format interdit"
    exit_gate: 'Demander "CONTINUER" → S3'
    next: S3

  S3:
    name: BUILD_CORE_PAGES
    objective: "Homepage + navbar + footer + composants globaux."
    inputs: [design_system, research_data.json, "lot images S2"]
    deliverables:
      - index.html (version définitive, remplace le placeholder S0)
      - assets/js/main.js / search.js / utils.js
